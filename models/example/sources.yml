
version: 2

sources:
  - name: retail
    database: RETAIL_DB
    schema: RAW

    tables:
      - name: customers_raw
        description: "Raw customer records from source systems"

        # Source Freshness Configuration
        config:
          loaded_at_field: CREATED_AT

          freshness:
            warn_after:
              count: 12
              period: hour

            error_after:
              count: 24
              period: hour

        # Data Quality Tests
        columns:
          - name: FIRST_NAME
            description: "Customer first name"
            data_tests:
              - not_null

          - name: LAST_NAME
            description: "Customer last name"
            data_tests:
              - not_null

          - name: EMAIL
            description: "Customer email address"
            data_tests:
              - not_null
              - unique

          - name: PHONE
            description: "Customer phone number"
            data_tests:
              - not_null

          - name: CITY
            description: "Customer city"
            data_tests:
              - not_null

          - name: STATE
            description: "Customer state"
            data_tests:
              - not_null

          - name: COUNTRY
            description: "Customer country"
            data_tests:
              - not_null

          - name: CREATED_AT
            description: "Record creation timestamp"
            data_tests:
              - not_null

          - name: UPDATED_AT
            description: "Record update timestamp"

          - name: SOURCE_SYSTEM
            description: "Originating source system"
            data_tests:
              - not_null